    for (const d of drips) { if (d.age > 0.45) { d.m.visible = false; continue; } d.age += dt; d.m.position.z += dz; d.m.scale.setScalar(1 + d.age * 9); d.m.material.opacity = Math.max(0, 1 - d.age / 0.45) * 0.6 * L.rain; }

    snowP.visible = L.snow > 0.01;
    if (snowP.visible) { snowMat.opacity = L.snow * 0.95;
      for (let i = 0; i < N_SNOW; i++) { const j = i * 3, q = snowV[i]; snowPos[j] += Math.sin(time * 1.1 + q.ph) * 0.5 * dt; snowPos[j + 1] -= q.vy * dt; snowPos[j + 2] += dz;
        if (snowPos[j + 1] < 0) snowPos[j + 1] = 14; if (snowPos[j + 2] > 8) { snowPos[j + 2] -= 60; snowPos[j] = rand(-20, 20); } }
      snowGeo.attributes.position.needsUpdate = true; }

    // the end: the leaves you caught, going up
    if (show.fin > 0) {
      show.fin = Math.min(1, show.fin + dt / 7); show.finT += dt; lanterns.visible = true; lanMat.opacity = Math.min(1, show.finT * 0.8);
      for (let i = 0; i < show.lanN; i++) { const q = lans[i], j = i * 3; let u = show.finT - q.d; if (u > 24) { q.d += 24; u -= 24; }
        if (u < 0) { lanPos[j + 1] = -50; continue; }
        lanPos[j] = show.lanX + q.vx * u + Math.sin(u * 0.8 + q.ph) * 0.9; lanPos[j + 1] = 0.5 + q.vy * u; lanPos[j + 2] = -1 - q.vz * u; }
      lanGeo.attributes.position.needsUpdate = true;
    }

    // the wake on the water
    ringT -= dt;
    if (onBoat && ringT <= 0 && show.hold) { ringT = 0.14; const r = rings.reduce((a, b) => (a.age > b.age ? a : b)); r.age = 0; r.m.position.set(bx, 0.06, 1.4); r.m.visible = true; }
    for (const r of rings) { if (r.age > 1.7) { r.m.visible = false; continue; } r.age += dt; r.m.position.z += dz; r.m.scale.setScalar(1 + r.age * 2.6); r.m.material.opacity = Math.max(0, 1 - r.age / 1.7) * 0.7 * Math.max(L.water, bk); }

    // the look, written out to the scene
    groundMat.color.copy(L.ground); laneMat.color.copy(L.lane); laneMat.opacity = L.laneA; lane.visible = L.laneA > 0.01;
    dashMat.opacity = L.dash * L.laneA; dash.visible = dashMat.opacity > 0.01; dashTex.offset.y = (show.dist / 4) % 1;
    railMat.opacity = L.rails; rails.visible = L.rails > 0.01; plat.visible = L.plat > 0.01; plat.scale.y = Math.max(0.0001, L.plat);
    wireMat.opacity = L.rails * 0.8; wire.visible = rails.visible; paveMat.opacity = L.pave; pave.visible = L.pave > 0.01; paveTex.offset.y = (show.dist / 16) % 1;
    if (canalTex) canalTex.offset.y = (time * 0.03) % 1;
    scene.fog.color.copy(L.fog); scene.fog.near = L.fogNear; scene.fog.far = L.fogFar; renderer.setClearColor(L.fog);
    hemi.color.copy(L.hemiSky); hemi.groundColor.copy(L.hemiGnd); hemi.intensity = L.hemiI; sunL.color.copy(L.sun); sunL.intensity = L.dirI;
    sunDir.set(0.18, L.sunY, -1).normalize(); sunL.position.copy(sunDir).multiplyScalar(100);
    frameMat.color.copy(L.frame); shirtMat.color.copy(L.shirt); hairMat.color.copy(L.hair); skinMat.color.copy(L.skin); jeansMat.color.copy(L.jeans);
    const su = skyMat.uniforms; su.cTop.value.copy(L.skyTop); su.cHor.value.copy(L.skyHor); su.sunCol.value.copy(L.sun); su.cloudCol.value.copy(L.cloudCol); su.clouds.value = L.clouds; su.time.value = time; su.drift.value = show.dist * 0.0016; su.stars.value = L.stars;
    water.visible = L.water > 0.002; ground.visible = L.water < 0.99;            // under the lake there is no ground to shimmer through
    const wu = waterMat.uniforms; wu.cDeep.value.copy(L.deep); wu.cSky.value.copy(L.skyHor); wu.sunCol.value.copy(L.sun); wu.fogCol.value.copy(L.fog);
    wu.glit.value = 0.9 * (1 - L.stars * 0.8);                  // at dusk the sparkle on the water is turned down: with the sun this low it flickered
    wu.time.value = time; wu.scroll.value = show.dist; wu.alpha.value = L.water; wu.fogNear.value = L.fogNear; wu.fogFar.value = L.fogFar;
    const bars = (L.bars * 11) + 'vh'; $('barT').style.height = bars; $('barB').style.height = bars;
    const pu = postMat.uniforms; pu.time.value = time; pu.sat.value = L.sat; pu.vig.value = L.vig; pu.grain.value = L.grain; pu.contrast.value = L.contrast;
    if (part === 'end') pu.grain.value = 0;                      // and the film grain stops, so nothing shimmers behind the text
    pu.hurt.value = show.hurt; pu.rain.value = L.rain; pu.tint.value.copy(L.tint); pu.chroma.value = L.chroma + show.flash * 0.004; pu.flash.value = show.flash;

    // the camera: low behind the rider, with a crane up and back at the break
    const crane = part === 'break' && tw ? Math.sin(Math.PI * k) : 0, fin = ease(show.fin);    // at the very end it lifts, slowly, to take in the sky
    const still = show.part === 'end' ? 0 : 1 - fin;             // on the last screen the camera holds still
    vB.set(bx * 0.55 + Math.sin(time * 0.7) * 0.12 * still, 2.35 + Math.sin(time * 1.3) * 0.05 * still + crane * 4.5 + bk * 0.25 + fin * 4.5, 6.6 + crane * 3 + bk * 0.8 + fin * 10);
    vB.x += Math.sin(time * 53) * 0.1 * show.wob; vB.y += Math.cos(time * 61) * 0.07 * show.wob;
    m4.lookAt(vB, tgt.set(bx * 0.75, 1.25 + crane * 1.5 + fin * 4.2, -12 - fin * 24), UP); camera.position.copy(vB); camera.quaternion.setFromRotationMatrix(m4);
    camera.rotateZ(clamp(bvx * 0.012, -0.08, 0.08));
    camera.fov = 58 + pulse * 0.7 + crane * 6; camera.updateProjectionMatrix();
    wu.camPos.value.copy(camera.position); sky.position.copy(camera.position);
    glow.position.copy(camera.position).addScaledVector(sunDir, 1000); glow.material.opacity = L.glow;
  }
  function render() { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); }
  function frame(now) { const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; if (!paused) update(dt); render(); requestAnimationFrame(frame); }

  // For a look at one world: __ride.jump('karli')
  window.__ride = { show, LOOKS, WORLDS, ROUTE, reset,
    weather(w) { weather = w; }, lookFor,
    jump(name) { reset(true); const i = ROUTE.indexOf(name); show.wi = i; snap(lookFor(name)); layoutWorld(name, true); Sound.calm(name === 'lake'); $('lives').classList.add('on'); go(name); },
    fin(n) { this.jump('lake'); onBoat = true; setScore(n || 40); go('finale'); },
    hurt() { setLives(show.lives - 1); }, wayOpen,
    ring, obst, spawnOb(type, x) { spawnOb(type, x || 0); },
    step(n, dt) { for (let i = 0; i < (n || 1); i++) update(dt || 1 / 60); render(); } };
  requestAnimationFrame(frame);
})();
</script>
